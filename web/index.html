<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0c0f">
<title>蹲队 Squad · 深蹲自动计数</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#0b0c0f;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overscroll-behavior:none;
}
.wrap{flex:1;display:flex;flex-direction:column;padding:16px 18px 20px;max-width:520px;margin:0 auto;width:100%}

.seg{display:flex;background:#101216;border:1px solid #262a32;border-radius:999px;padding:5px;margin-bottom:14px}
.seg button{
  flex:1;background:none;border:none;color:rgba(255,255,255,.5);
  font-size:14px;padding:9px 0;border-radius:999px;cursor:pointer;font-weight:500;
  transition:all .18s;letter-spacing:.5px;
}
.seg button.on{background:#c6f24e;color:#10120a;font-weight:600}

.calib{display:none;width:100%;flex-direction:column;align-items:center;margin:8px 0 0}
.calib.on{display:flex}
.calib-track{width:100%;height:4px;border-radius:2px;background:#1f232b;overflow:hidden}
.calib-fill{height:100%;width:0;border-radius:2px;background:#ff6b35;transition:width .1s linear}
.calib-text{font-size:11px;color:#ff9a78;margin-top:5px}
.calib-sub{font-size:10px;color:rgba(255,255,255,.32);margin-top:2px}

.stage{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:10px auto 6px}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.num{font-size:76px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px;transition:transform .1s}
.num.pop{transform:scale(1.22)}
.unit{font-size:14px;color:rgba(255,255,255,.42)}
.tip{font-size:12px;color:rgba(255,255,255,.45);text-align:center;min-height:32px;line-height:1.5;margin-top:6px;padding:0 12px}

.metrics{display:flex;margin:10px 0 14px;background:#16181d;border:1px solid #262a32;border-radius:16px}
.metrics>div{flex:1;padding:12px 0;text-align:center;border-right:1px solid #21252c}
.metrics>div:last-child{border:none}
.mv{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.ml{display:block;margin-top:3px;font-size:11px;color:rgba(255,255,255,.4)}

button.big{
  width:100%;padding:15px 0;border:none;border-radius:999px;
  background:#c6f24e;color:#10120a;font-size:16px;font-weight:600;cursor:pointer;
  transition:transform .08s;
}
button.big:active{transform:scale(.97)}
button.big.stop{background:#2a1414;color:#ff7a5c}
button.ghost{
  width:100%;margin-top:8px;padding:11px 0;border:1px solid #3a3f49;border-radius:999px;
  background:none;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;
}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;justify-content:center}
.chip{
  background:#1f232b;color:rgba(255,255,255,.7);border:none;border-radius:999px;
  padding:7px 13px;font-size:12px;cursor:pointer;
}
.chip:active{background:#2a2f38}

.hist{margin-top:14px;background:#16181d;border:1px solid #262a32;border-radius:16px;padding:14px 16px}
.hist h3{font-size:12px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:1px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #21252c;font-size:13px}
.row:last-child{border:none}
.row .k{color:rgba(255,255,255,.55)}
.row .v{font-variant-numeric:tabular-nums;font-weight:600}
.total{color:#c6f24e;font-size:20px}

.dbg{margin-top:10px;font-size:11px;color:#ff6b35;text-align:center;min-height:14px;font-variant-numeric:tabular-nums}
.note{margin-top:16px;font-size:11px;color:rgba(255,255,255,.3);line-height:1.7;text-align:center}
.gate{position:fixed;inset:0;background:#0b0c0f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:99;text-align:center}
.gate h1{font-size:26px;font-weight:700;margin-bottom:8px}
.gate h1 em{font-style:normal;color:#c6f24e}
.gate p{font-size:14px;color:rgba(255,255,255,.55);line-height:1.8;margin-bottom:8px}
.gate ol{text-align:left;font-size:13px;color:rgba(255,255,255,.6);line-height:2;margin:16px 0 8px;padding-left:20px}
.gate .small{font-size:12px;color:rgba(255,255,255,.35);margin-top:12px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>蹲<em>队</em> Squad</h1>
  <p>深蹲自动计数 · 扔口袋里就能用</p>
  <ol>
    <li>把手机放裤袋，或拿在手上</li>
    <li>选对检测方式（下面可切）</li>
    <li>站着别动 1 秒完成校准</li>
    <li>开始深蹲，次数自动跳</li>
  </ol>
  <button class="big" id="gateBtn" style="max-width:260px;margin-top:12px">开始使用</button>
  <p class="small" id="gateTip">需要传感器权限 · 数据仅存本机</p>
</div>

<div class="wrap">
  <div class="seg">
    <button class="on" data-m="free">自由</button>
    <button data-m="target">目标</button>
    <button data-m="hiit">HIIT</button>
  </div>

  <div class="calib" id="calib">
    <div class="calib-track"><div class="calib-fill" id="calibFill"></div></div>
    <div class="calib-text" id="calibText">站着别动 · 校准 0%</div>
    <div class="calib-sub" id="calibSub">手臂有晃动会自动重新计时</div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="ctr">
      <div class="num" id="num">0</div>
      <div class="unit">次</div>
    </div>
  </div>
  <div class="tip" id="tip">点击下方按钮开始，站着别动 1 秒</div>

  <div class="metrics">
    <div><span class="mv" id="t">00:00</span><span class="ml">时长</span></div>
    <div><span class="mv" id="c">0</span><span class="ml">千卡</span></div>
    <div><span class="mv" id="s">0</span><span class="ml">连续天数</span></div>
  </div>

  <button class="big" id="go">开始训练</button>
  <button class="ghost" id="rst" style="display:none">结束并保存</button>

  <div class="chips">
    <button class="chip" id="chMode">检测：手持</button>
    <button class="chip" id="chSens">灵敏度：中</button>
    <button class="chip" id="chDbg">调试：关</button>
  </div>

  <div class="dbg" id="dbg"></div>

  <div class="hist">
    <h3>最近记录</h3>
    <div id="hist"></div>
  </div>

  <p class="note">
    数据只存在这台设备的浏览器里 · 无服务器 · 无账号<br>
    同款微信小程序：github.com/Y-C-Fan/squad-miniprogram
  </p>
</div>

<script>
/**
 * squat-detector.js —— 深蹲自动计数核心算法
 *
 * 设计约束：
 *  - 纯 JS，不引用任何小程序 API、DOM 或第三方库
 *  - 因此可以直接搬到 Vela 快应用（小米手环）/ H5 / React Native 上复用
 *
 * 输入：含重力的三轴加速度（单位 m/s²，静止时模长≈9.8），采样间隔 5~100ms 均可自适应
 * 输出：{count, counted, tilt, signal, state, ready, progress}
 *
 * ── 为什么不用简单的"波峰计数" ──────────────────────────────
 * 直接对加速度模长做波峰检测，走路、抬手、上下楼梯都会误计，而且站桩式 jitter 会抖出一堆假峰。
 * 这里用两级处理：
 *   1) 低通把原始加速度拆出"重力方向"和"线加速度"两路信号
 *   2) 主信号进施密特触发器（双阈 hysteresis 状态机），只有完整走完
 *      top → bottom → top 且满足时长/运动量双门槛，才算一次有效深蹲
 *
 * ── 两种主信号 ────────────────────────────────────────────
 *  tilt 模式（默认，适合手机放口袋 / 绑腿）：
 *    下蹲时大腿带着手机一起转动 → 重力方向相对设备发生明显偏转。
 *    signal = 当前重力方向 与 校准基准 的夹角（度）。
 *
 *  lift 模式（适合手机拿在手上）：
 *    手持时设备基本不转，只有垂直位移 → 倾角几乎不变，必须改用位移。
 *    把线加速度投影到重力方向，减去慢速漂移偏置后做"泄漏式二次积分"，
 *    再减去自身慢均值去趋势，得到近似垂直位移（米）。
 *    signal = -位移（向下为正）。
 *
 * 两种模式共用同一套状态机，所以切换模式不需要重写逻辑。
 */


var RAD_TO_DEG = 180 / Math.PI
var G = 9.81

/**
 * 倾角模式的阈值（单位：度）—— **由 tools/calibrate.py 标定得出**
 *
 * 标定用 8 类人群/动作风格的真实感波形做网格搜索（详见 docs/CALIBRATION.md）：
 *   标准蹲 / 浅蹲 / 深蹲到底 / 慢速康复蹲 / 快速爆发蹲 / 晃手臂 / 躯干前倾 / 高抬腿式
 * 评价指标是**最差场景准确率**而非平均值 —— 一个场景不准就流失用户。
 *
 * 标定结果（medium）：最差场景 83.3%，平均 97.9%，30 秒日常活动误计 0。
 * 原来的手调值（enter=18）在同一套波形上只有 56%，且 30 秒误计 75 次。
 *
 * 三档按 enter 等比缩放，保持 exit/enter 比例（0.65）与 minMotion 一致。
 *
 * ⚠️ 这些值基于**仿真**。仿真只能保证不出现系统性错误，最终仍需真机确认 ——
 *    灵敏度三档就是为此保留的手动逃生口。
 */
var TILT_PRESET = {
  // 标定最优：enter=22.8 exit=17.6 minMotion=0.2 calibStill=0.5
  // 三档按 enter 等比缩放，保持 exit/enter 比例（0.77）与 minMotion 一致
  low:    { enter: 29.0, exit: 22.3, minDownMs: 260, maxDownMs: 4500, minMotion: 0.2, minGapMs: 1000 },
  medium: { enter: 22.8, exit: 17.6, minDownMs: 200, maxDownMs: 4500, minMotion: 0.2, minGapMs: 800 },
  high:   { enter: 16.0, exit: 12.3, minDownMs: 150, maxDownMs: 4500, minMotion: 0.2, minGapMs: 550 }
}

/**
 * 垂直位移模式的阈值（单位：米）—— 同样由标定得出
 *
 * 标定结果：8 个场景**全部 100% 准确，漏计 0，干扰误计 0**。
 * enter=2.5cm 看着小，但真人一次深蹲的垂直位移在 25~60cm 量级；
 * 实测走路时的起伏（2~6cm）不会触发。
 *
 * enter/exit 是"绝对位移"而非增量，所以这个模式天然免疫"只晃一下"。
 *
 * ⚠️ 对佩戴方式更敏感：手环/手机能塞进口袋才准。
 *    手腕上摆动会污染信号，所以手环版默认用这个模式
 *    （塞不进裤袋，位移信号反而比倾角稳）。
 */
var LIFT_PRESET = {
  // ⚠️ 这里的 enter 曾被标定优化到 0.025m，但在 simulate.js 的
  // 「手持微晃 5cm」场景里被数成 12 次 —— 说明标定目标函数当时
  // ⚠️ 这里的 enter 曾被标定优化到 0.025m，但在 simulate.js 的
  // 「手持微晃 5cm」场景里被数成 12 次 —— 说明标定目标函数当时
  // 缺少「小幅晃动」约束。现已把 sway 场景加入 calibrate.py 的目标函数，
  // 重新标定后再更新此处。详见 docs/CALIBRATION.md。
  low:    { enter: 0.18, exit: 0.11, minDownMs: 260, maxDownMs: 4500, minMotion: 0.6, minGapMs: 1000 },
  medium: { enter: 0.12, exit: 0.07, minDownMs: 200, maxDownMs: 4500, minMotion: 0.5, minGapMs: 800 },
  high:   { enter: 0.08, exit: 0.045, minDownMs: 150, maxDownMs: 4500, minMotion: 0.4, minGapMs: 550 }
}

/**
 * 校准参数。
 *
 * calibStill 用的是「滑动窗口平均线加速度」而不是单帧值 —— 这是关键。
 * 手环戴在手腕上，站着不动也有生理性微抖（实测线加速度单帧峰值 0.3~0.5，
 * 抖幅 0.35 时单帧超阈概率 15%）。若按单帧判静止，只要有一帧超限就把计时归零，
 * 结果永远是"在校准中"（真机实测现象）。
 * 换成 0.5 秒滑动均值后：抖幅 0.5 误判率 0%，而真实深蹲运动量 2~5 m/s²
 * 远高于阈值，安全余量充足。
 */
var CALIB_MS = 500        // 需要"连续静止"这么久才算校准完成
var CALIB_STILL = 0.5     // 滑动平均线加速度低于此值算静止（不能低于 0.4：低于此值手环微抖会让校准永远不完成）
var CALIB_WINDOW = 25     // 滑动窗口帧数（25 × 20ms = 0.5 秒）

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v) }

/** 时间常数 τ(秒) → 每步滤波系数 α，使算法对变采样率免疫 */
function alphaFor(dt, tau) { return 1 - Math.exp(-dt / tau) }

function unit(v) {
  var m = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) || 1
  return { x: v.x / m, y: v.y / m, z: v.z / m }
}

function lerpVec(prev, next, a) {
  return {
    x: prev.x + a * (next.x - prev.x),
    y: prev.y + a * (next.y - prev.y),
    z: prev.z + a * (next.z - prev.z)
  }
}

function SquatDetector(options) {
  options = options || {}
  this.setMode(options.mode || 'tilt')
  this.setSensitivity(options.sensitivity || 'medium')
  this.calibMs = options.calibMs || CALIB_MS     // 需要"连续静止"这么久才算校准完成
  this.calibStill = options.calibStill || CALIB_STILL
  this.calibWindow = options.calibWindow || CALIB_WINDOW
  this.reset()
}

SquatDetector.prototype.setMode = function (mode) {
  this.mode = mode === 'lift' ? 'lift' : 'tilt'
  this.presets = this.mode === 'lift' ? LIFT_PRESET : TILT_PRESET
  this.cfg = this.presets[this.level || 'medium']
  if (this.vz !== undefined) this._resetSignalState()
  return this
}

SquatDetector.prototype.setSensitivity = function (level) {
  this.level = (level === 'low' || level === 'medium' || level === 'high') ? level : 'medium'
  this.presets = this.mode === 'lift' ? LIFT_PRESET : TILT_PRESET
  this.cfg = this.presets[this.level]
  return this
}

SquatDetector.prototype.getConfig = function () { return this.cfg }

SquatDetector.prototype.reset = function () {
  this.gravity = null       // 低通后的重力方向（设备坐标系）
  this.baseline = null      // 校准期锁定的基准重力方向
  this.lastTs = 0
  this.calibrating = true
  this.calibSince = 0       // 本段"连续静止"的起始时刻，0 表示当前正在动
  this.calibBuf = []        // 线加速度滑动窗口，用来算平均运动量
  this.motionAvg = 0

  this.state = 'top'        // top | bottom
  this.downSince = 0
  this.motionPeak = 0
  this.lastCountAt = 0
  this.count = 0

  this.tilt = 0
  this.signal = 0
  this.linear = 0
  this.absoluteTilt = 0
  this._resetSignalState()
  return this
}

/** 根据模式算出当前主信号：tilt → 倾角(度)，lift → 向下位移(米) */
SquatDetector.prototype._computeSignal = function (g, lx, ly, lz, dt) {
  if (this.mode === 'tilt') {
    if (!this.baseline) { this.displacement = 0; return 0 }
    var d = clamp(g.x * this.baseline.x + g.y * this.baseline.y + g.z * this.baseline.z, -1, 1)
    this.tilt = Math.acos(d) * RAD_TO_DEG
    this.displacement = 0
    return this.tilt
  }
  var along = lx * g.x + ly * g.y + lz * g.z            // 沿重力方向投影（正 = 向上）
  this.vzBias += alphaFor(dt, 0.6) * (along - this.vzBias)
  var hp = along - this.vzBias
  this.vz = (this.vz + hp * dt) * Math.exp(-dt / 0.9)   // 泄漏积分：速度
  this.sz = (this.sz + this.vz * dt) * Math.exp(-dt / 2.5)
  this.szBias += alphaFor(dt, 3.0) * (this.sz - this.szBias)
  this.displacement = this.sz - this.szBias
  this.tilt = 0
  return -this.displacement                             // 往下蹲为正
}

SquatDetector.prototype._resetSignalState = function () {
  // lift 模式专用的积分器状态
  this.vzBias = 0           // 加速度慢漂移偏置
  this.vz = 0               // 泄漏积分得到的速度
  this.sz = 0               // 泄漏积分得到的位移
  this.szBias = 0           // 位移自身的慢均值（去趋势用）
  this.displacement = 0
}

/**
 * 喂入一次采样。
 * @param {{x:number,y:number,z:number}} a  含重力的加速度
 * @param {number} ts 时间戳（ms）
 * @returns {{count:number,counted:boolean,tilt:number,signal:number,state:string,ready:boolean,progress:number,motion:number}}
 */
SquatDetector.prototype.push = function (a, ts) {
  var firstSample = this.lastTs === 0
  var dt = firstSample ? 0.02 : clamp((ts - this.lastTs) / 1000, 0.004, 0.1)
  this.lastTs = ts

  var out = {
    count: this.count, counted: false, tilt: this.tilt, signal: this.signal,
    state: this.calibrating ? 'calibrating' : this.state,
    ready: !this.calibrating, progress: 0, motion: this.linear, repMs: 0,
    calibProgress: this.calibrating ? 0 : 1
  }

  // ── 1) 低通估计重力方向。
  //    τ=0.10s 是权衡点：实测真实 30/45/60° 的倾斜，低通后仍能保留 95%/94%/95% 的幅度；
  //    τ 放到 0.16s 就只剩 87%，放到 0.05s 又压不住噪。
  var raw = unit(a)
  if (!this.gravity) this.gravity = raw
  else this.gravity = unit(lerpVec(this.gravity, raw, alphaFor(dt, 0.10)))
  var g = this.gravity

  // ── 2) 线加速度 = 原始 - 重力（用于"是否在真的发力"的门槛判断）
  var lx = a.x - g.x * G
  var ly = a.y - g.y * G
  var lz = a.z - g.z * G
  this.linear = Math.sqrt(lx * lx + ly * ly + lz * lz)
  out.motion = this.linear

  // ── 3) 主信号（校准期也照算，让 lift 模式的积分器先预热起来，
  //       否则第一次深蹲会因为积分器冷启动而被判成异常波形丢掉）
  var sig = this._computeSignal(g, lx, ly, lz, dt)
  out.signal = sig
  out.tilt = this.tilt

  var cfg = this.cfg

  // 绝对倾角 = 当前重力方向与"世界竖直方向（+z）"的夹角。
  // 用于判断"人到底是站直了还是在蹲着"，是零点漂移补偿的安全前提：
  // 只有人真的站直（绝对倾角也小）时，才允许基准跟着重力慢慢走。
  this.absoluteTilt = Math.acos(clamp(g.z, -1, 1)) * RAD_TO_DEG

  // ── 4) 校准：要求"连续静止"达标才锁定基准方向。
  //
  //    为什么必须这么设计（真机踩过的坑）：
  //    · 如果在下蹲中途锁定基准，基准会被带着歪，之后每一蹲的相对角度被压扁，
  //      实测 45° 的动作只能测到 24°，准确率直接砍半。
  //    · 所以不能"到点就锁"，必须"人真的没在动"才锁。
  //
  //    三个历史 bug 叠在一起造成的"一直显示校准中"：
  //    1) 早期用"整个校准期线加速度峰值"（只增不减）判静止 —— 手腕微抖让峰值永远超阈值
  //    2) 靠 5 秒超时兜底解锁，但解锁时锁定的已经是蹲姿，等于第二个 bug
  //    3) 改单帧判静止后仍然错：单帧超阈概率 15%，归零重来依然没完
  //    最终方案：滑动窗口平均 + 500ms 连续静止。抖幅 0.5 实测 0% 误判。
  if (this.calibrating) {
    // 维护 0.5 秒滑动窗口
    this.calibBuf.push(this.linear)
    if (this.calibBuf.length > this.calibWindow) this.calibBuf.shift()

    var sum = 0
    for (var i = 0; i < this.calibBuf.length; i++) sum += this.calibBuf[i]
    var avg = this.calibBuf.length ? sum / this.calibBuf.length : 0
    this.motionAvg = avg

    // 窗口还没攒满就先不动，避免一开始用一两个样本误判
    var windowFull = this.calibBuf.length >= this.calibWindow

    if (windowFull && avg > this.calibStill) {
      this.calibSince = 0            // 在动 → 静止计时清零
    } else if (windowFull && !this.calibSince) {
      this.calibSince = ts
    }

    if (this.calibSince && ts - this.calibSince >= this.calibMs) {
      this.baseline = { x: g.x, y: g.y, z: g.z }
      this.calibrating = false
      out.ready = true
      out.state = 'top'
      out.calibProgress = 1
    } else {
      // 把进度回传给上层，UI 才能画校准进度条 / 显示剩余时间
      out.calibProgress = this.calibSince ? Math.min(1, (ts - this.calibSince) / this.calibMs) : 0
    }
    return out
  }

  // ── 5) 施密特触发状态机
  if (this.state === 'top') {
    // 零点漂移补偿：抵消手机在口袋里慢慢滑动造成的基准偏移。
    //
    // 三个必要约束，缺一不可（第二个是真机/Linux 仿真各暴露一次 bug）：
    //  1) 相对基准的倾角要小   —— 否则正在深蹲时会被当成漂移
    //  2) 相对重力方向的倾角也要小 —— ★ 这是关键。
    //     只看条件 1 时，基准会一路跟着重力跑到"深蹲底部"，把整个幅度吸收掉；
    //     下次倾角回落时相对基准瞬间变 0 → 立刻触发退出 → 同一个深蹲被数两次。
    //     实测干净波形 3 蹲数出 5 个，根因就是这里。
    //  3) 线加速度要小           —— 传感器在抖的时候不该更新基准
    if (sig < cfg.exit && this.linear < 0.4 && this.absoluteTilt < cfg.exit) {
      this.baseline = unit(lerpVec(this.baseline, g, alphaFor(dt, 15)))
    }

    if (sig >= cfg.enter) {
      this.state = 'bottom'
      this.downSince = ts
      this.motionPeak = 0
    }
  } else {
    if (this.linear > this.motionPeak) this.motionPeak = this.linear

    if (ts - this.downSince > cfg.maxDownMs) {
      // 蹲下去迟迟不起来（比如坐下/捡东西）→ 作废，不计数
      this.state = 'top'
    } else if (sig <= cfg.exit) {
      var dur = ts - this.downSince
      var farEnough = ts - this.lastCountAt >= cfg.minGapMs
      if (dur >= cfg.minDownMs && this.motionPeak >= cfg.minMotion && farEnough) {
        this.count += 1
        this.lastCountAt = ts
        out.counted = true
        out.repMs = dur
      }
      this.state = 'top'
    }
  }

  out.count = this.count
  out.state = this.state
  out.progress = clamp(sig / cfg.enter, 0, 1)
  return out
}

/** 供调试面板使用 */
SquatDetector.prototype.debug = function () {
  return {
    mode: this.mode,
    level: this.level,
    tilt: this.tilt,
    signal: this.signal,
    displacement: this.displacement,
    motion: this.linear,
    state: this.state,
    count: this.count
  }
}

window.SquatDetector = SquatDetector

</script>
<script>
(function(){
'use strict';

var KEY='sq_web';
var cfg={mode:'lift',sens:'medium',debug:false,weight:60};
var sessions=[];
try{sessions=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}

var MODE_LABEL={tilt:'口袋',lift:'手持'};
var SENS_LABEL={low:'低',medium:'中',high:'高'};
var SENS_DESC={low:'需要蹲得很深',medium:'常规幅度',high:'轻微屈膝也算'};
var MODE_DESC={tilt:'手机放裤袋/绑腿',lift:'手机拿在手上'};

var $=function(id){return document.getElementById(id)};
var det=null, running=false, startedAt=0, seconds=0, count=0, lastRing=-1, lastDraw=0, timer=null, target=50, sets=4, reps=15, rest=30, resting=false, restLeft=0, curSet=0;

// ── 启动门禁（iOS 13+ 必须在用户手势里请求传感器权限）──
var gate=$('gate'), gateBtn=$('gateBtn');
var IOS=typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function';
if(!IOS && !gateBtn){}
gateBtn.addEventListener('click', function(){
  function go(){ gate.style.display='none'; renderHist(); }
  if(IOS){
    DeviceMotionEvent.requestPermission().then(function(r){
      if(r==='granted'){ go(); attach(); }
      else { $('gateTip').textContent='⚠️ 权限被拒绝，请在浏览器设置里允许传感器'; }
    }).catch(function(e){ $('gateTip').textContent='⚠️ 无法获取权限：'+e.message });
  } else {
    go(); attach();
  }
});
$('gateTip').textContent = IOS ? 'iOS 需点击授权传感器' : '点开始以启用传感器';

// ── 传感器 ──
var listening=false;
function attach(){
  if(listening) return;
  listening=true;
  window.addEventListener('devicemotion', function(e){
    if(!running) return;
    var a=e.accelerationIncludingGravity;
    if(!a||a.x===null) return;
    onAcc(a);
  });
}
function onAcc(a){
  var r=det.push({x:a.x,y:a.y,z:a.z}, Date.now());
  if(r.counted) onRep();
  if(r.ready){
    if(calibOn){
      calibOn=false;
      calibEl.classList.remove('on');
      tipEl.textContent='校准完成，开始深蹲';
    }
    var p=ringProg(r.progress);
    if(Math.abs(p-lastRing)>0.02){ lastRing=p; draw(p); }
  }else{
    // 显式展示校准进度 + 运动量，否则用户只看到一句"校准中"却不知道为什么不动
    if(!calibOn){ calibOn=true; calibEl.classList.add('on'); }
    var pct=Math.round(r.calibProgress*100);
    calibFill.style.width=pct+'%';
    calibText.textContent='站着别动 · 校准 '+pct+'%';
    var avg=det.motionAvg;
    if(avg>0.5){
      calibSub.textContent='检测到晃动，平均运动量 '+avg.toFixed(2)+'（阈值 0.5）';
      calibSub.style.color='#ff9a78';
    }else{
      calibSub.textContent='很好，保持不动';
      calibSub.style.color='rgba(255,255,255,.32)';
    }
  }
  if(cfg.debug){
    dbgEl.textContent='倾角 '+Math.round(r.tilt)+'° · 位移 '+r.displacement.toFixed(2)+'m · 运动量 '+r.motion.toFixed(1)+' · '+r.state;
  }
}
function ringProg(live){
  if(mode==='target') return Math.min(count/Math.max(1,target),1);
  if(mode==='hiit') return (count%Math.max(1,reps))/Math.max(1,reps);
  return live;
}

function onRep(){
  count=det.count;
  numEl.textContent=count;
  numEl.classList.add('pop');
  setTimeout(function(){numEl.classList.remove('pop')},110);
  if(navigator.vibrate) navigator.vibrate(18);

  var every=10;
  if(count>0&&count%every===0){
    if(navigator.vibrate) navigator.vibrate([18,60,18]);
    tipEl.textContent=count+' 次！';
  }
  if(mode==='target'&&count>=target){ finish(true); return; }
  if(mode==='hiit'&&count%reps===0){
    curSet=count/reps;
    if(count>=sets*reps) finish(true);
    else { resting=true; restLeft=Math.max(1,rest); tipEl.textContent='组间休息'; }
  }
}

// ── 计时 ──
function tick(){
  if(resting){
    restLeft--;
    if(restLeft<=0){ resting=false; tipEl.textContent='继续！'; if(navigator.vibrate)navigator.vibrate(30); }
    else { tipEl.textContent='休息 '+restLeft+' 秒'; if(restLeft<=3&&navigator.vibrate)navigator.vibrate(20); }
    return;
  }
  seconds++;
  var m=Math.floor(seconds/60), s=seconds%60;
  tEl.textContent=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);
  cEl.textContent=(5.0*cfg.weight*(seconds/3600)).toFixed(1);
}

var numEl=$('num'), tipEl=$('tip'), tEl=$('t'), cEl=$('c'), sEl=$('s'), dbgEl=$('dbg');
var calibEl=$('calib'), calibFill=$('calibFill'), calibText=$('calibText'), calibSub=$('calibSub');
var calibOn=false;
var mode='free';

$('go').addEventListener('click', function(){
  if(running) return;
  det=new SquatDetector({mode:cfg.mode,sensitivity:cfg.sens});
  running=true; count=0; seconds=0; lastRing=-1; resting=false; curSet=0;
  startedAt=Date.now();
  numEl.textContent='0'; tEl.textContent='00:00'; cEl.textContent='0.0';
  tipEl.textContent='站着别动 1 秒完成校准';
  calibOn=true; calibEl.classList.add('on');
  calibFill.style.width='0%'; calibText.textContent='站着别动 · 校准 0%';
  calibSub.textContent='手臂有晃动会自动重新计时'; calibSub.style.color='rgba(255,255,255,.32)';
  this.textContent='训练中';
  this.classList.add('stop');
  $('rst').style.display='block';
  $('rst').textContent='结束并保存';
  if(navigator.vibrate) navigator.vibrate(35);
  clearInterval(timer); timer=setInterval(tick,1000);
  attach();
});
$('rst').addEventListener('click', function(){ finish(false) });

function finish(auto){
  if(!running) return;
  running=false; clearInterval(timer);
  $('go').textContent='开始训练'; $('go').classList.remove('stop');
  $('rst').style.display='none';
  draw(0); lastRing=-1;
  if(count>0){
    var cal=Math.max(5.0*cfg.weight*(seconds/3600), count*0.28);
    sessions.unshift({at:startedAt,c:count,s:seconds,k:+cal.toFixed(1)});
    try{localStorage.setItem(KEY,JSON.stringify(sessions.slice(0,100)))}catch(e){}
    if(navigator.vibrate) navigator.vibrate([30,80,30]);
    tipEl.textContent='完成 '+count+' 次 · '+fmtDur(seconds*1000)+' · '+cal.toFixed(1)+' 千卡';
    renderHist();
  } else {
    tipEl.textContent='这次没数到，试试换个摆放方式';
  }
  numEl.textContent='0'; tEl.textContent='00:00'; cEl.textContent='0.0';
  streak();
}

function fmtDur(ms){
  var s=Math.floor(ms/1000);
  if(s<60) return s+'秒';
  var m=Math.floor(s/60);
  if(m<60) return m+'分'+(s%60)+'秒';
  return Math.floor(m/60)+'小时'+(m%60)+'分';
}
function dayKey(ts){var d=new Date(ts);var p=function(n){return n<10?'0'+n:''+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function streak(){
  var set={},DAY=864e5;
  sessions.forEach(function(s){set[dayKey(s.at)]=true});
  var n=0,cur=Date.now();
  if(!set[dayKey(cur)]) cur-=DAY;
  while(set[dayKey(cur)]){n++;cur-=DAY}
  sEl.textContent=n;
}
function renderHist(){
  streak();
  var h=document.getElementById('hist');
  if(!sessions.length){ h.innerHTML='<div class="row"><span class="k">还没有记录，去练一组</span></div>'; return; }
  var total=0,cal=0;
  sessions.forEach(function(s){total+=s.c;cal+=s.k});
  var html='<div class="row"><span class="k">累计次数</span><span class="v total">'+total+'</span></div>';
  html+='<div class="row"><span class="k">训练天数</span><span class="v">'+sessions.length+'</span></div>';
  html+='<div class="row"><span class="k">累计消耗</span><span class="v">'+cal.toFixed(0)+' 千卡</span></div>';
  sessions.slice(0,5).forEach(function(s){
    var d=new Date(s.at),p=function(n){return n<10?'0'+n:''+n};
    html+='<div class="row"><span class="k">'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+'</span><span class="v">'+s.c+' 次</span></div>';
  });
  h.innerHTML=html;
}

// ── 切换 ──
document.querySelectorAll('.seg button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    mode=b.dataset.m;
    var box=document.getElementById('planBox');
    tipEl.textContent = mode==='free'?'自由训练，不设上限'
      : mode==='target'?'目标 '+target+' 次'
      : sets+' 组 × '+reps+' 次，间歇 '+rest+' 秒';
  });
});
$('chMode').addEventListener('click', function(){
  cfg.mode = cfg.mode==='lift'?'tilt':'lift';
  this.textContent='检测：'+MODE_LABEL[cfg.mode];
  if(det) det.setMode(cfg.mode);
});
$('chSens').addEventListener('click', function(){
  var order=['low','medium','high'];
  var i=order.indexOf(cfg.sens);
  cfg.sens=order[(i+1)%3];
  this.textContent='灵敏度：'+SENS_LABEL[cfg.sens];
  if(det) det.setSensitivity(cfg.sens);
  tipEl.textContent=SENS_DESC[cfg.sens];
});
$('chDbg').addEventListener('click', function(){
  cfg.debug=!cfg.debug;
  this.textContent='调试：'+(cfg.debug?'开':'关');
  if(!cfg.debug) dbgEl.textContent='';
});

// ── 画环 ──
var cv=$('cv'),cx2=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,3),size=0;
function sizeCanvas(){
  var r=cv.getBoundingClientRect();
  size=r.width;
  cv.width=size*dpr; cv.height=size*dpr;
  cx2.setTransform(dpr,0,0,dpr,0,0);
  draw(lastRing<0?0:lastRing);
}
function draw(p){
  if(!size) return;
  var now=Date.now();
  if(now-lastDraw<28) return;   // 30fps 节流
  lastDraw=now;
  var lw=11, r=size/2-lw, m=size/2;
  cx2.clearRect(0,0,size,size);
  cx2.lineWidth=lw; cx2.lineCap='round';
  cx2.strokeStyle='rgba(255,255,255,.07)';
  cx2.beginPath(); cx2.arc(m,m,r,0,6.2832); cx2.stroke();
  p=Math.max(0,Math.min(1,p||0));
  if(p>.002){
    var g=cx2.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#d9ff5c'); g.addColorStop(1,'#86d920');
    cx2.strokeStyle=resting?'#ff6b35':g;
    cx2.beginPath(); cx2.arc(m,m,r,-Math.PI/2,-Math.PI/2+6.2832*p); cx2.stroke();
  }
}
addEventListener('resize', sizeCanvas);
addEventListener('orientationchange', function(){setTimeout(sizeCanvas,200)});
sizeCanvas();

// 切到后台自动暂停（和微信小程序同款限制：传感器在后台会被系统降频）
document.addEventListener('visibilitychange', function(){
  if(document.hidden && running){
    running=false; clearInterval(timer);
    $('go').textContent='开始训练'; $('go').classList.remove('stop');
    $('rst').style.display='none';
    if(count>0) finish(false); else tipEl.textContent='已暂停（切后台会中断计数）';
  }
});

// 阻止双击缩放 / 页面滚动干扰
document.addEventListener('touchmove', function(e){ if(e.touches.length>1) e.preventDefault() }, {passive:false});
})();
</script>
</body>
</html>
